[project]
name = "developercards-ingest"
version = "1.8.0"
description = "Turn a PDF, web page or text file into cited, numbered text chunks for DeveloperCards authoring."
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "pypdf>=6.19.0",
]

[project.scripts]
dc-ingest = "dc_ingest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dc_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
