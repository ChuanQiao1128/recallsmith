name: CI

on:
  # Branches only, so a pushed tag runs no CI. CD (cd.yml) starts on this workflow's push runs, and workflow_run reports
  # a tag push with head_branch = the tag's name: a tag named `main` would look like a push to main there (cd.yml also
  # refuses any commit that is not on the main branch).
  push:
    branches: ['**']
  pull_request:

# Read-only token for every job: nothing here pushes, comments, deploys or reads a secret.
permissions:
  contents: read

# Every action is pinned to a full commit SHA, with the release it was cut from as the trailing
# comment: a tag can be moved to other code, a commit cannot. .github/dependabot.yml bumps the pins
# and their comments together, weekly, in one PR. Never rename a job's `name:` — the main ruleset
# requires these checks by that exact string, and a rename leaves every PR waiting on a check that
# never reports.

jobs:
  mobile:
    name: mobile (typecheck + vitest + expo export)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      # Dependency advisories as a gate, the frontend job's way: the shipped tree
      # only (`--omit=dev`), failing on high and critical. Unlike frontend this one
      # could not start at zero. On 2026-10-03 the tree carried 71 high/critical
      # advisories in 20 packages, and every fix changes package-lock.json, which
      # reaches users only through an App Store binary or an OTA update — a mobile
      # change of its own. A lockfile-only update on 2026-10-04 left 9 in 5
      # packages, none of them in the exported bundle (see each entry's reason).
      #
      # So they are listed in npm-audit-allowlist.json, one entry per advisory with
      # its reason and an expiry date. A high or critical advisory that is not
      # listed fails here, and so does every entry from its expiry date on, so the
      # list cannot quietly become permanent. `|| true` because npm audit exits 1
      # whenever it finds anything at all; the script decides, and treats a report
      # it cannot read (a registry error, say) as a failure, never as a pass.
      - run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/npm-audit.json" || true
          python3 ../infra/scripts/check-npm-audit.py --allowlist npm-audit-allowlist.json --audit-json "$RUNNER_TEMP/npm-audit.json"
      # `tsc --noEmit`, and unlike the frontend job that IS a real check here:
      # mobile/tsconfig.json extends expo/tsconfig.base and has no `include`,
      # so tsc falls back to "every .ts/.tsx under the project root" — 315
      # files, App.tsx, src/, tests/ and scripts/ included.
      #
      # It earns its place because vitest cannot see what it covers. When the
      # unused `progress` field came off SelectionInput, all 73 suites stayed
      # green and scripts/bench-hot-paths.ts still passed the dead field —
      # nothing in tests/ imports that file, so only the compiler found it.
      #
      # Before the tests, not after: a type error is a cheaper and more precise
      # failure than whatever runtime shape it turns into, and it needs no
      # test run to report.
      - run: npm run test:typecheck
      - run: npx vitest run
      # Local Metro bundle only (no EAS, no token): a broken metro.config.js or
      # Sentry Expo plugin fails CI here instead of in a paid EAS build.
      - run: npx expo export --platform ios --output-dir dist-ci

  frontend:
    name: frontend (vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Dependency advisories, as a gate rather than as a thing someone might
      # read. This job already installs the exact tree the browser gets, so the
      # check costs one command and no extra state.
      #
      # `--omit=dev` because the two trees have genuinely different threat
      # models. A prod advisory is code this app ships to a browser and runs
      # against a user's session; a dev advisory is vite, postcss or a lint
      # plugin, which runs on a developer's machine and in this runner and
      # reaches no user. Auditing everything would mean either a red CI that
      # says nothing about the product, or an ignore-list that quietly grows
      # until it covers the advisory that mattered.
      #
      # `--audit-level=high` sets where it fails, not what it reports: moderate
      # and low findings are still printed. When this was added the prod tree
      # had four high findings — react-router 7.13.1 sat inside an open-redirect
      # advisory, and axios 1.13.6 pulled a CRLF-injection in form-data — and
      # both were upgraded in the same change, so this starts green rather than
      # starting with an exemption.
      - run: npm audit --omit=dev --audit-level=high
      # `npm run lint` (= `eslint .`) rather than an explicit path list, because
      # `.` is a strict superset (102 files vs 98 today) and cannot be defeated
      # by adding a top-level file and forgetting to extend the list.
      #
      # NO `--max-warnings 0`, deliberately. The one warning is
      # DeckListPage.tsx:590 (react-hooks/exhaustive-deps on the publish-jobs
      # poller); fixing it means touching polling code that
      # tests/deckListPagePolling.test.tsx pins character-for-character. The bar
      # here is 0 ERRORS, not 0 problems.
      - run: npm run lint
      - run: npx vitest run
      # This IS the type-check step. `npm run build` is `tsc -b && vite build`,
      # so a type error stops the job before vite starts.
      #
      # And never `tsc --noEmit`: tsconfig.json here is references-only with no
      # include, so it checks ZERO files — `--listFiles` prints nothing and it
      # exits 0 with a real type error sitting in src/. It is not a check.
      - run: npm run build
        env:
          # Baked into the bundle by Vite and attached to every report
          # frontend/src/lib/reportError.ts sends. Set here rather than
          # defaulted in code because a build id has to come from outside the
          # build: anything the source could compute about itself is the same
          # string in every deploy. With this unset the module falls back to
          # import.meta.env.MODE, which is useless but true — a fabricated
          # sha-shaped placeholder would send someone looking for a commit that
          # does not exist.
          VITE_BUILD_ID: ${{ github.sha }}

  e2e:
    name: frontend (playwright smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    # Its own job rather than three more steps on `frontend`, and therefore
    # parallel with it. Two reasons, both measured rather than stylistic: it
    # needs a ~180 MB browser download that the other job has no use for, and a
    # browser failure and a unit failure should be able to be reported
    # separately — appending it would mean a red smoke test hides which of the
    # five existing gates were even reached.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # `--with-deps` installs the shared libraries headless Chromium needs on
      # a bare ubuntu runner (fonts, nss, libdrm and friends). Without it the
      # browser downloads fine and then fails to launch, which reads as a test
      # failure rather than as a missing package.
      #
      # `chromium` only, matching the single project in playwright.config.ts. A
      # bare `playwright install` pulls Firefox and WebKit as well — roughly a
      # gigabyte — to run nothing.
      - run: npx playwright install --with-deps chromium
      # The webServer in playwright.config.ts builds the app first
      # (`vite build --mode e2e`) and serves dist/ on port 5173, so this step
      # exercises the real bundle rather than a dev server. It does NOT set
      # VITE_BUILD_ID: that build is thrown away when the job ends, and a smoke
      # run is not a deploy whose reports anyone will look up by sha.
      - run: npx playwright test
      # Only on failure, because a browser failure is the one kind in this
      # repository that cannot be reproduced by reading the log: the trace has
      # the DOM, the network and a screenshot at the failing step.
      #
      # `test-results/`, not `playwright-report/`. The reporters configured for
      # CI are `github` and `list`, neither of which writes an HTML report, so
      # that directory does not exist — an upload step pointed at it would warn
      # and produce nothing, which is the shape of a diagnostic that is only
      # discovered to be empty on the day it is needed. `trace:
      # 'retain-on-failure'` and `screenshot: 'only-on-failure'` both write
      # here. Open one with `npx playwright show-trace <the zip>`.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7

  backend:
    name: backend (dotnet test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src_C
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          # The SDK comes from src_C/global.json (10.0.100, rollForward latestFeature, which this
          # action reads as "latest 10.0"), so CI and a laptop resolve the same SDK line and a
          # net10.0 project can never be handed SDK 8. Path is from the repo root: `uses:` steps
          # ignore the job's working-directory default.
          global-json-file: src_C/global.json
      # The test project is named explicitly so this step is pinned to one
      # known project: src_C's root holds both RecallSmith.Lambda.sln and
      # RecallSmith.Lambda.csproj, so a bare `dotnet test` here depends on
      # which of the two MSBuild picks.
      - run: dotnet test Tests/RecallSmith.Lambda.IntegrationTests

  # Every Python package (services/*, tools/ingest, evals) with a pyproject.toml:
  # the committed uv.lock must be current and its pytest suite must pass.
  # New Python packages are picked up without editing this job.
  python:
    name: python (uv lock + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Full history so check-gate-freshness.py can find the merge base with the base branch.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: bash -n the Python Lambda deploy script
        run: bash -n services/deploy-python-lambda.sh
      - name: uv lock --check && pytest in every Python package
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for d in services/*/ tools/ingest/ evals/; do
            [ -f "${d}pyproject.toml" ] || continue
            found=1
            echo "::group::${d}"
            (cd "$d" && uv lock --check && uv run --python 3.12 pytest -q)
            echo "::endgroup::"
          done
          [ "$found" = 1 ] || { echo "no Python package found" >&2; exit 1; }
      # The same packages, audited for known vulnerabilities in what they ship: the
      # locked runtime dependencies (`--no-dev`; evals' optional `embeddings` extra is
      # a local-only tool and stays out). `--no-emit-local` drops evals' path
      # dependencies on services/ai-qa and tools/ingest, which are audited as packages
      # of their own. `--disable-pip` with the lock's hashes means nothing is
      # downloaded or installed: the pinned list is checked as it stands against the
      # PyPI advisory data. `--strict` makes a dependency that cannot be audited a
      # failure rather than a skip. pip-audit has no severity filter, so ANY known
      # vulnerability fails here, which is stricter than the npm gates; on 2026-10-03
      # all seven packages were clean. pip-audit itself is pinned so a new release
      # cannot change the verdict without a commit. Every package is audited before
      # the step fails, so one red run names them all.
      - name: pip-audit the runtime dependencies of every Python package
        shell: bash
        run: |
          set -euo pipefail
          failed=""
          for d in services/*/ tools/ingest/ evals/; do
            [ -f "${d}pyproject.toml" ] || continue
            echo "::group::pip-audit ${d}"
            (cd "$d" && uv export --frozen --no-dev --no-emit-project --no-emit-local --format requirements-txt --quiet \
              | uvx pip-audit@2.10.1 -r /dev/stdin --disable-pip --require-hashes --strict --progress-spinner off) \
              || failed="${failed} ${d}"
            echo "::endgroup::"
          done
          [ -z "$failed" ] || { echo "::error::pip-audit failed for:${failed}"; exit 1; }
      - name: unit tests for infra/scripts (stdlib unittest)
        run: python3 -m unittest discover -s infra/scripts/tests -v
      # A change to the ai-qa prod env or any file under services/ai-qa/src/ai_qa/, with AI_QA_ENABLED
      # on at HEAD, needs a committed evals/reports run that matches the shipping config and passes
      # `dc-evals score --gate` (offline re-score, no model call); a prompt text change also needs a
      # PROMPT_VERSION / PROMPT_VERSION_AUTOMATION bump. Prints why it passes otherwise. See
      # infra/README.md §3. A pull request compares with the merge base of its base branch; a push
      # (main included) compares with the commit before the push, or HEAD~1 when that is unusable.
      # Refs and SHAs go through env, not straight into the script, so they are never shell text.
      - name: AI QA gate freshness (check-gate-freshness.py)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: origin/${{ github.base_ref || 'main' }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            python3 infra/scripts/check-gate-freshness.py --base "$BASE_REF"
          else
            python3 infra/scripts/check-gate-freshness.py --before "$BEFORE_SHA"
          fi

  # Terraform and deploy-script checks that need no AWS: fmt, an offline init (-backend=false, the
  # provider comes from the public registry) and validate, the observability module's terraform
  # test (mocked provider), on every run but a push to main the allow-list rule of the Terraform pipeline, the
  # agent-route census, bash -n on the deploy scripts, the merge-env.sh unit tests and the CD script
  # tests (fake aws/gh/curl). Never plan or apply: both need AWS credentials, and this job has none
  # (terraform.yml applies after merge, behind the infra-prod approval; infra/RUNBOOK.md §15).
  infra:
    name: infra (terraform fmt/validate + agent routes + deploy scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Full history so tf-pipeline.py pr-check can find the merge base with the base branch.
          fetch-depth: 0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          # versions.tf asks for >= 1.10; pinned so a new terraform release cannot change fmt output.
          terraform_version: 1.16.3
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra
      # -lockfile=readonly: the committed lock carries only two h1: hashes (not linux), so init would otherwise
      # add a linux one; readonly verifies against the zh: hashes and never rewrites the lock.
      - run: terraform -chdir=infra/envs/prod init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=infra/envs/prod validate
      # Offline `terraform test` of the observability module (mocked aws provider): the V12 AI QA
      # dashboard row and p95 alarms. The module has no committed lock; the one init writes here is
      # never committed.
      - run: terraform -chdir=infra/modules/observability init -backend=false -input=false
      - run: terraform -chdir=infra/modules/observability test
      # A pull request that changes Terraform (a plan-affecting file under infra/) adds or changes its
      # docs/delivery/**/*.plan-allow.json (one per change; a release brings several, which must not contradict
      # each other), of the shape check-plan.py reads, and carries no code the pipeline refuses to run
      # (tf-pipeline.py preflight). After merge, terraform.yml checks the plan against them before it applies.
      # The rule runs here, in a required job, because only these nine checks gate auto-merge; terraform.yml has
      # no pull request job. It runs on every run but a push to main: a branch push reports a check under the
      # same name for the same commit as its pull request, and that check must not pass by skipping the rule.
      - name: Terraform allow-list rule (tf-pipeline.py pr-check)
        if: github.ref != 'refs/heads/main'
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: python3 infra/scripts/tf-pipeline.py pr-check --base "$BASE_REF"
      - run: python3 infra/scripts/check-agent-routes.py
      # Every `runtime = "..."` under infra/ against a table of AWS Lambda deprecation dates; fails on
      # an unknown runtime or one deprecating within 90 days. It reads today's date, so this step turns
      # red by itself 90 days before a deprecation (dotnet8 was 38 days out when it was replaced).
      - name: Lambda runtime deprecation check (check-lambda-runtimes.py)
        run: python3 infra/scripts/check-lambda-runtimes.py
      - name: bash -n the deploy scripts
        run: |
          bash -n src_C/deploy.sh
          bash -n frontend/deploy.sh
          bash -n services/lambda-release.sh
          bash -n infra/scripts/operator-cutover.sh
          bash -n src_C/scripts/merge-env.sh
          bash -n site/deploy.sh
          bash -n frontend/scripts/check-bundle-dsn.sh
          for f in scripts/*.sh scripts/lib/*.sh scripts/cd/*.sh scripts/tests/*.sh; do bash -n "$f"; done
      # Pure jq, no aws, no network (jq ships on ubuntu-latest).
      - run: bash src_C/scripts/merge-env.test.sh
      # The CD pipeline's scripts (.github/workflows/cd.yml) and the deploy scripts' PREBUILT mode, AWS_PROFILE
      # default and local preflight, run for real against fake aws/gh/curl in a throwaway git repo: no network, no
      # credentials. Also pins cd.yml's static facts (pinned actions, OIDC only in the approved jobs) and that the
      # preflight's required-check list equals this file's job names.
      - name: CD and deploy-script tests (scripts/tests/cd-scripts.test.sh)
        run: bash scripts/tests/cd-scripts.test.sh

  mcp-server:
    name: tools/mcp-server (build + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/mcp-server
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/mcp-server/package-lock.json
      - run: npm ci
      # The frontend job's gate: shipped tree only, fails on high and critical.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npm test

  n8n-recipes:
    name: integrations/n8n (signature verifier + recipe logic)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/n8n
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
      # No npm audit here: there is no package.json. lib/ imports only node: built-ins,
      # so there is no dependency tree to audit.
      - run: node --test lib/

  author-runner:
    name: tools/author-runner (build + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/author-runner
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/author-runner/package-lock.json
      - run: npm ci
      # The frontend job's gate. The runner has no runtime dependencies today, so this
      # passes vacuously; it is here so the first one is audited from the day it lands.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npm test
