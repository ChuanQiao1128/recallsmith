[project]
name = "developercards-ai-qa"
version = "0.1.0"
description = "SQS-driven pre-publish AI QA Lambda for DeveloperCards (Claude via Bedrock Mantle or the Anthropic API)"
requires-python = ">=3.12,<3.13"
dependencies = ["anthropic[bedrock]>=1.8.0", "pydantic>=2"]

[dependency-groups]
dev = ["pytest>=8", "boto3==1.43.103"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_qa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
