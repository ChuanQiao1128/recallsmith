[project]
name = "developercards-notifier"
version = "0.1.0"
description = "Notifier Lambda for DeveloperCards: sends core-rendered automation emails through SES and forwards the scheduler's tick to core"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "boto3==1.43.103"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
