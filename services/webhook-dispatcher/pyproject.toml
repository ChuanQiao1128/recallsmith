[project]
name = "developercards-webhook-dispatcher"
version = "0.1.0"
description = "SQS-driven outbound webhook dispatcher Lambda for DeveloperCards"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "boto3==1.43.103"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webhook_dispatcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
