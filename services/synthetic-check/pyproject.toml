[project]
name = "developercards-synthetic-check"
version = "0.1.0"
description = "Scheduled synthetic check Lambda for DeveloperCards: probes the public API, CDN and console paths the app depends on"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "boto3==1.43.103"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synthetic_check"]

[tool.pytest.ini_options]
testpaths = ["tests"]
