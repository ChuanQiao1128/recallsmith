[project]
name = "developercards-source-watcher"
version = "0.1.0"
description = "Hourly source watcher Lambda for DeveloperCards: fetches watched pages and feeds and reports observations to core"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "boto3==1.43.103"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/source_watcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
